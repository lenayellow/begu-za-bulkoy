window.addEventListener('error', function(ev){ window.__bootErr((ev.message||'?')+' @'+(ev.lineno||'')+':'+(ev.colno||'')); });
window.addEventListener('unhandledrejection', function(ev){ const m=String(ev.reason&&ev.reason.message||ev.reason||'');
  if(/audio|AudioContext|NotAllowedError|interrupted|play\(\)/i.test(m)){ ev.preventDefault(); return; } // звук на iPhone иногда не стартует — это не ошибка игры, просто играем без звука
  window.__bootErr('promise: '+m); });

<script>window.GAME_PLATFORM='vk';</script><script>
// ===== Настройки (всё, что можно подкрутить, — здесь) =====

};
let DIFF = 'normal'; try{ DIFF = localStorage.getItem('sosulki_diff') || 'normal'; if(!DIFFS[DIFF]) DIFF='normal'; }catch(e){}
const D = ()=>DIFFS[DIFF];
const cityStart = lv => lv - ((lv-1)%4);

// ===== Ежедневные задания и «шагомер» =====

const QUEST_POOL = [
  {id:'bulki',  t:n=>'Собери '+n+' булок',                 goals:[40,80],  min:1,  r:30},
  {id:'nofall', t:n=>'Пройди '+n+' уровня подряд без падений', goals:[2,3], min:1,  r:40},
  {id:'pyshka', t:n=>'Подбери '+n+' пышки',                goals:[2,3],    min:1,  r:25},
  {id:'ice',    t:n=>'Перехитри '+n+' падающих сосулек',    goals:[5,8],    min:2,  r:30},
  {id:'hole',   t:n=>'Перепрыгни '+n+' открытых люков',     goals:[3,5],    min:3,  r:30},
  {id:'robot',  t:n=>'Сбей шавермой '+n+' робота',          goals:[1,2],    min:3,  r:40},
  {id:'tapok',  t:n=>'Увернись от '+n+' тапков бабушки',     goals:[2,3],    min:8,  r:40},
  {id:'level',  t:n=>'Пройди '+n+' уровня за день',          goals:[3,5],    min:1,  r:30},
  {id:'ride',   t:n=>'Прокатись верхом '+n+' раз',           goals:[1,2],    min:31, r:50},
];
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function seeded(str){ let h=2166136261; for(const ch of str){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return ()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%10000)/10000; }; }
let DAILY=null;
function loadDaily(){
  try{ DAILY = JSON.parse(localStorage.getItem('sosulki_daily')); }catch(e){ DAILY=null; }
  if(!DAILY || DAILY.date!==todayKey()){
    let ml=1; try{ ml = Math.max(1, +localStorage.getItem('sosulki_maxlevel')||1); }catch(e){}
    const rnd = seeded(todayKey()), pool = QUEST_POOL.filter(q=>ml>=q.min), pick=[];
    while(pick.length<3 && pool.length){ const q = pool.splice(Math.floor(rnd()*pool.length),1)[0]; pick.push({id:q.id, goal:q.goals[Math.floor(rnd()*q.goals.length)], prog:0, done:false, r:q.r}); }
    DAILY = {date:todayKey(), steps:0, quests:pick, allDone:false, charged:false, used:false};
    saveDaily();
  }
}
function saveDaily(){ try{ localStorage.setItem('sosulki_daily', JSON.stringify(DAILY)); }catch(e){} }
function questText(q){ const d=QUEST_POOL.find(p=>p.id===q.id); return d ? d.t(q.goal) : q.id; }
let nofallStreak = 0;
function Q(id, n=1, setTo){ // событие для заданий
  if(!DAILY) return;
  if(id==='steps'){
    const was = DAILY.steps; DAILY.steps += n;
    if(was < STEP_GOAL && DAILY.steps >= STEP_GOAL){ DAILY.charged=true; saveDaily(); showBanner('10 000 шагов! Суперзаряд на следующий забег'); snd(500,1500,0.5,'square',0.07); }
    return;
  }
  for(const q of DAILY.quests){
    if(q.id!==id || q.done) continue;
    q.prog = setTo!==undefined ? Math.max(q.prog,setTo) : q.prog+n;
    if(q.prog>=q.goal){ q.prog=q.goal; q.done=true; addBulki(q.r); seasonXP(30); showBanner('Задание дня выполнено! +'+q.r+' булок'); [880,1100,1320].forEach((f,i)=>setTimeout(()=>snd(f,f,0.08,'square',0.05),i*90));
      if(!DAILY.allDone && DAILY.quests.every(x=>x.done)){ DAILY.allDone=true; addBulki(100); roofKeys++; saveKeys(); setTimeout(()=>showBanner('Все задания дня! +100 булок и 🗝 ключ от чердака'),1800); }
    }
  }
  saveDaily();
}
function addBulki(n){ runBulki+=n; totalBulki+=n; try{localStorage.setItem('sosulki_bulki',totalBulki);}catch(e){} } try{ maxLevel = Math.max(1, +localStorage.getItem('sosulki_maxlevel') || 1); }catch(e){}
let W = 320; const H = 180, GROUND = 150, ROOF = 42;
let PX = 70;
const ICE_W = 9, ICE_H = 18;
const FALLF = Math.sqrt(2*(GROUND-ICE_H-ROOF-4)/CFG.iceGravity);

const BRIDGES = ['Дворцовый','Троицкий','Литейный','Благовещенский','Большеохтинский','Биржевой','Тучков'];
const BR_LEN = 260;
function bridgeAt(x){ const L=Math.floor(x/CFG.levelLen)+1, b0=L*CFG.levelLen-BR_LEN-20; return (x>=b0 && x<b0+BR_LEN) ? {L,b0} : null; }

function alleyAt(x){ const L=Math.floor(x/CFG.levelLen); if(L===1 && GRIB===6 && cityOfL(1)===0) return null; if(isHighwayL(L) || cityOfL(L)===1 || WARM(cityOfL(L))) return null; const a0 = L===0 ? 380 : L*CFG.levelLen+60; return (x>=a0 && x<a0+240) ? {L,a0} : null; }
const SIGNS = [['ПЫШЕЧНАЯ',C.red,C.w],['ПАРАДНАЯ №1',C.navy,C.w],['БУЛКИ ИЗ ДОБА',C.brn,C.yel],['ШАВЕРМА 24',C.grn,C.w],['ПОРЕБРИК',C.dg,C.w],['КУРА-ГРИЛЬ',C.org,C.k],['ПАРАДНАЯ №2',C.navy,C.w]];
function blizAt(x, pad=0){ const L=Math.floor(x/CFG.levelLen); if(L<2 || WARM(cityOfL(L)) || (L%2 && !COLD(cityOfL(L))) || cityOfL(L)===1) return null; const z0=L*CFG.levelLen+340; return (x>=z0-pad && x<z0+280+pad) ? {L,z0} : null; }
const BLIZ_SLOW = 0.7;
// слякоть: на 2-м, 4-м, 6-м… уровне вместо метели. Заносит, прыжок срабатывает с задержкой
function slushAt(x, pad=0){ const L=Math.floor(x/CFG.levelLen); if(L===1 && GRIB===6 && cityOfL(1)===0) return null; if(L<1 || WARM(cityOfL(L)) || L%2===0 || COLD(cityOfL(L))) return null; const z0=L*CFG.levelLen+340; return (x>=z0-pad && x<z0+280+pad) ? {L,z0} : null; }
const SLUSH_DELAY = 6, SLUSH_GRIP = 0.03;
const LEVEL_NAMES = ['Двор','Гороховая','Садовая','Невский','Дворцовая','Васильевский','Петроградка','Купчино','Сенная','Лиговский'];
const LEVEL_NAMES_M = ['Тверская','Арбат','Китай-город','Лубянка','Таганка','Замоскворечье','Пресня','Сокольники','ВДНХ','Красная площадь'];

const SIGNS_M = [['ШАУРМА',C.grn,C.w],['ПОДЪЕЗД №1',C.navy,C.w],['БУЛОЧНАЯ',C.brn,C.yel],['ПРОДУКТЫ 24',C.red,C.w],['БОРДЮР',C.dg,C.w],['МЕТРО',C.red,C.w],['ПОДЪЕЗД №2',C.navy,C.w]];

const N_CITIES = 22;
// ===== Маршруты =====
// города: 0 Петербург, 1 Москва, 2 Екатеринбург, 3 Сургут, 4 Якутск, 5 Казань
const CITY_NAMES = ['Петербург','Москва','Екатеринбург','Сургут','Якутск','Казань','Великий Новгород','Тверь','Нижний Новгород','Новосибирск','Петрозаводск','Мурманск','Иркутск','Хабаровск','Владивосток','Камчатка','Космодром Восточный','Тула','Геленджик','Сочи','Самара','Тольятти'];

const MAP_PTS = {'Петербург':[110,150],'Великий Новгород':[112,170],'Тверь':[125,180],'Москва':[135,192],'Нижний Новгород':[158,200],'Казань':[182,207],'Екатеринбург':[235,205],'Сургут':[290,150],'Новосибирск':[330,215],'Иркутск':[430,240],'Якутск':[560,120],'Хабаровск':[655,215],'Владивосток':[665,258],'Космодром Восточный':[600,172],'Марс':[860,28],'Тула':[140,207],'Геленджик':[118,242],'Сочи':[136,250],'Камчатка':[815,135],'Петрозаводск':[122,122],'Мурманск':[150,72],'Самара':[196,226],'Тольятти':[184,224]};
const ROUTES = [
  {n:'Две столицы',   ic:'🏛', c:[0,6,7,1], path:['Петербург','Великий Новгород','Тверь','Москва'], boss:'🚜 Снегоуборочная машина', price:0},
  {n:'По Волге',      ic:'🌊', c:[1,8,5,20], path:['Москва','Нижний Новгород','Казань','Самара','Тольятти'],              boss:'🤖 Робот-великан', price:300},
  {n:'Через Урал',    ic:'⛰', c:[5,2,3], path:['Казань','Екатеринбург','Сургут'],                  boss:'🐻 Медведь-шатун', price:500},
  {n:'Полюс холода',  ic:'🥶', c:[3,9,4], path:['Сургут','Новосибирск','Якутск'],                   boss:'❄️ Хозяин мороза', price:700},
  {n:'Русский Север', ic:'🌌', c:[0,10,11], path:['Петербург','Петрозаводск','Мурманск'], boss:'🛷 Горки Хибин (без босса!)', price:900},
  {n:'Байкал и океан',ic:'🌅', c:[12,13,14,15],    path:['Иркутск','Хабаровск','Владивосток','Камчатка'],    boss:'🦀 Шторм и краб', price:1100},
  {n:'Космос', ic:'🚀', c:[16], path:['Хабаровск','Космодром Восточный','Марс'], boss:'🚀 Полёт на Марс', price:2000, space:1},

];

let RS = {open:0, done:{}, prog:{}, city:{}};
try{ RS = Object.assign(RS, JSON.parse(localStorage.getItem('sosulki_routes'))||{}); }catch(e){}
try{ if(!localStorage.getItem('sosulki_routes') && (+localStorage.getItem('sosulki_maxlevel')||1)>1) RS.open=3; }catch(e){} // старые тестировщики: все маршруты открыты

function runKey(){ return RUN.r>=0 ? 'r'+RUN.r : 'c'+RUN.cities[0]; }
function WARM(c){ return c===18 || c===19; }
function COLD(c){ return c===3 || c===4 || c===9 || c===12 || c===13 || c===16; }
function cityOfL(L){ const c=RUN.cities, i=Math.floor(L/CITY_LEN), r=c[Math.max(0,Math.min(c.length-1,i))]; return (r===20 && ((L%CITY_LEN)+CITY_LEN)%CITY_LEN===3) ? 21 : r; }           // L — номер уровня с нуля

  const q = new URLSearchParams(location.search), h = location.hash||'';
  if(q.get('platform')) return q.get('platform');
  if(q.get('vk_app_id') || q.get('vk_platform')) return 'vk';
  if(h.includes('tgWebAppData') || (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData)) return 'tg';
  // Яндекс Игры определяем только по сборке (GAME_PLATFORM) — в Яндекс Браузере и на чужих страницах это обычный сайт
  return 'web';
}
const PLATFORM = detectPlatform();
function loadScript(src, ok){ const sc=document.createElement('script'); sc.src=src; sc.async=true; sc.onload=ok; sc.onerror=()=>{}; document.head.appendChild(sc); }
// снимок всех сохранений игры (ключи sosulki_*)
function snapshotSave(){ const o={}; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.startsWith('sosulki_')) o[k]=localStorage.getItem(k); } }catch(e){} return o; }
// облачное сохранение пришло: берём его, если там прогресса больше
function mergeCloud(cloud){
  if(!cloud){ YA.saveCloud(); return; }
  const localML=+(localStorage.getItem('sosulki_maxlevel')||1), cloudML=+(cloud.sosulki_maxlevel||1);
  const localB=+(localStorage.getItem('sosulki_bulki')||0), cloudB=+(cloud.sosulki_bulki||0);
  if((cloudML>localML || cloudB>localB) && !sessionStorage.getItem('cloud_synced')){
    for(const k in cloud) localStorage.setItem(k, cloud[k]);
    sessionStorage.setItem('cloud_synced','1'); location.reload();
  }
}
// хранилища ВК и Telegram берут не больше ~4 КБ на ключ — режем сохранение на куски
function chunk(str, n){ const out=[]; for(let i=0;i<str.length;i+=n) out.push(str.slice(i,i+n)); return out; }

let AC = null;
function snd(f1, f2, dur, type='square', vol=0.08){
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended' && !adPlaying){ const r=AC.resume(); if(r&&r.catch) r.catch(()=>{}); }
    const o = AC.createOscillator(), gn = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    gn.gain.setValueAtTime(vol,t); gn.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(gn); gn.connect(AC.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}

const key = {b:false,j:false};
let jumpPressed = false;
function setJ(v){ if(v && !key.j) jumpPressed = true; key.j = v; }
addEventListener('keydown', e=>{
  const k=e.code;
  if(k==='ArrowLeft'||k==='ArrowDown'||k==='KeyA'||k==='KeyS') key.b=true;
  else if(k==='Space'||k==='ArrowUp'||k==='KeyW'||k==='KeyZ'){ if(!e.repeat) setJ(true); e.preventDefault(); }
});
addEventListener('keyup', e=>{
  const k=e.code;
  if(k==='ArrowLeft'||k==='ArrowDown'||k==='KeyA'||k==='KeyS') key.b=false;
  else if(k==='Space'||k==='ArrowUp'||k==='KeyW'||k==='KeyZ') setJ(false);
});
function bindBtn(id, on, off){
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', e=>{e.preventDefault(); try{ b.setPointerCapture(e.pointerId); }catch(_){} b.classList.add('on'); on();});
  const up = e=>{b.classList.remove('on'); off();};
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
}
// Управление касаниями: весь экран — кнопка. Левые 40% — СТОП, остальное — ПРЫГ.
// Зона запоминается в момент касания, поэтому палец может уехать куда угодно — нажатие не пропадёт.
const ZP = new Map();
function playTarget(t){ if(!t || !t.closest) return false; if(t===exitBtn) return false; if(t.closest('#daily,#shop,#card,#start')) return false; const btn=t.closest('button'); return !btn || btn.id==='bl' || btn.id==='bj'; }
function applyZ(){ const v=[...ZP.values()], hb=v.includes('b'), hj=v.includes('j'); key.b=hb; document.getElementById('bl').classList.toggle('on',hb); document.getElementById('bj').classList.toggle('on',hj); if(hj && !key.j) setJ(true); else if(!hj && key.j && ZP.size>=0 && ZP.__j) setJ(false); ZP.__j=hj; }
document.addEventListener('pointerdown', e=>{ if(state!=='play' || !playTarget(e.target)) return; e.preventDefault();
  const z = e.target.closest('#bl') ? 'b' : e.target.closest('#bj') ? 'j' : (e.pointerType!=='mouse' && e.clientX < innerWidth*0.4) ? 'b' : 'j';
  ZP.set(e.pointerId, z); applyZ(); }, true);
const zUp = e=>{ if(ZP.has(e.pointerId)){ ZP.delete(e.pointerId); applyZ(); } };
addEventListener('pointerup', zUp, true); addEventListener('pointercancel', zUp, true);
addEventListener('blur', ()=>{ ZP.clear(); applyZ(); });

let SL=null;
const SL_LEN = 3600;
function slTerrain(){ // точки склона через каждые 20 px
  const pts=[]; let y=60, x=0, k=0;
  while(x<=SL_LEN+400){
    let dy = 3 + Math.sin(x/170)*2.2 + Math.sin(x/53)*0.8;
    if(x>SL_LEN) dy=0.3;
    pts.push({x,y,ramp:false}); y+=dy; x+=20; k++;
    if(x>300 && x<SL_LEN-200 && k%22===0){ // трамплин: короткий подъём
      pts.push({x,y,ramp:true}); y-=6; x+=20; pts.push({x,y,ramp:true}); y-=5; x+=20; pts.push({x,y,ramp:true, lip:true}); x+=20; y+=14;
    }
  }
  return pts;
}
function slY(x){ const P=SL.pts, i=Math.max(0,Math.min(P.length-2, Math.floor(x/20))); let a=P[i], b=P[i+1];
  for(let j=Math.max(0,i-3);j<Math.min(P.length-1,i+4);j++){ if(P[j].x<=x && P[j+1].x>x){ a=P[j]; b=P[j+1]; break; } }

}

function burst(x,y,col,n){ for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-0.5)*3,vy:-Math.random()*3,life:30+Math.random()*20,col}); }

// Генерация препятствий впереди — расстояния зависят от скорости, чтобы всегда было честно
function generate(){
  while(nextX < cam + 520){
    const sp0 = baseSpeed(), air = 2*-CFG.jumpVel/CFG.gravity;
    const sp = sp0 * (blizAt(nextX,150) ? BLIZ_SLOW : 1); // у входа в метель считаем по медленной скорости
    const minGap = sp*air + 30;
    const extra = Math.max(20, 110 - level*12);
    const iceChance = (WARM(cityOfL(level-1)) ? 0 : weekMod('ice') ? 0.85 : Math.min(0.55, 0.25 + level*0.05)) * ((cityOfL(level-1)===0 || level===1) ? 1 : 0.35);
    if(MODE==='zen'){ const r0=Math.random(); if(r0<0.5) obs.push({t:'item',k:'bulka',x:nextX,y:GROUND-14}); else if(r0<0.65) obs.push({t:'item',k:'token',x:nextX,y:GROUND-18}); else if(r0<0.75 && seasonActive()) obs.push({t:'item',k:'toy',x:nextX,y:GROUND-18}); nextX += Math.round(rnd(70,130)); continue; }
    const st0 = bridgeAt(nextX); if(st0 && isStation(st0.L)){ nextX = st0.b0 + BR_LEN + 20; continue; }
    const al0 = alleyAt(nextX);
    if(al0 && al0.L===0){ nextX = al0.a0 + 240 + 40; continue; } // 1-й уровень: в переулке просто темно, без препятствий
    const startX = nextX;
    // сосулька «за спиной»: падает сразу после того, как игрок пробежал — видно, что это опасно
    if(!WARM(cityOfL(level-1)) && Math.random() < (level===1 ? 0.5 : cityOfL(level-1)===0 ? 0.2 : 0.06) && onBuilding(nextX-30) && !noRoof(nextX) && !bridgeAt(nextX) && !blizAt(nextX,150)){
      obs.push({t:'ice', x:nextX - 30, after:true, trig:0, st:'hang', k:0, y:ROOF+4, vy:0, warn:CFG.iceWarn, grav:0.3});
    }
    if(level>=3 && [1,21].includes(cityOfL(level-1)) && Math.random()<0.15 && blizAt(nextX, 0) && blizAt(nextX+150, 0)){
      // застрявший в сугробе робот + шаверма незадолго до него
      obs.push({t:'item', k:'shav', x:nextX, y:GROUND-32});
      const rx = nextX + 110;
      obs.push({t:'drift', x:rx-3, w:20, h:6});
      obs.push({t:'robot', x:rx, stuck:true, st:'stuck', vx:0, hint:null});
      firstStuck=false;
      nextX = rx + 20 + sp0*BLIZ_SLOW*air + 40 + rnd(10,40);
    } else if(level>=2 && Math.random()<(cityOfL(level-1)===0 ? 0.5 : 0.45) && !lmAt(Math.floor((nextX+60)/112)) && !plotByBridge(Math.floor((nextX+60)/112)) && !WARM(-1) && !alleyAt(nextX) && !blizAt(nextX,200) && !bridgeAt(nextX) && !bridgeAt(nextX+150)){
      obs.push({t:'granny', x:nextX+60, st:'wait', k:0, trig: sp0*(40+38)+12});
      nextX += 60 + minGap + 60 + rnd(0,extra);
    } else if(level>=3 && Math.random()<({1:0.4,21:0.3}[cityOfL(level-1)]||0) && !alleyAt(nextX) && !blizAt(nextX,200) && !slushAt(nextX,200) && !bridgeAt(nextX) && !bridgeAt(nextX+120)){
      // робот-доставщик едет навстречу, начинает движение, когда игрок близко
      obs.push({t:'robot', x:nextX+70, st:'idle', vx:0, hint:null});
      firstRobot=false;
      nextX += 70 + 16 + minGap + rnd(0,extra);
    } else if(blizAt(nextX, 20)){
      // метель: только сугробы, расстояния — под замедленную скорость
      const spB = sp0*BLIZ_SLOW, dw = Math.round(Math.min(rnd(22,32), sp0*BLIZ_SLOW*(2*-CFG.jumpVel/CFG.gravity)*0.4 + 4)), dh = Math.round(rnd(5, 8));
      obs.push({t:'drift', x:nextX, w:dw, h:dh});
      const g2 = blizAt(nextX + dw + sp0*air + 40) ? spB : sp0; // на выходе из метели — обычная скорость
      nextX += dw + g2*air + 30 + rnd(10, Math.max(40, extra));
    } else if(level>=2 && Math.random()<iceChance && onBuilding(nextX) && !noRoof(nextX) && !noRoof(nextX+60) && !slushAt(nextX,150) && !blizAt(nextX,150) && !alleyAt(nextX) && !bridgeAt(nextX) && !bridgeAt(nextX+40)){
      const hit = Math.random() < 0.6;          // 60% — упадёт прямо на тебя, если не тормозить
      const trig = sp0*(CFG.iceWarn+FALLF) + (hit ? rnd(-4,6) : rnd(70,110));
      obs.push({t:'ice', x:nextX, trig: trig + (firstIce ? sp0*20 : 0), st:'hang', k:0, y:ROOF+4, vy:0, warn:CFG.iceWarn+(firstIce?20:0), grav:CFG.iceGravity, hint:null, tut: firstIce ? 'stop' : null});
      firstIce=false;
      nextX += minGap + 50 + rnd(0,extra);
    } else if(level>=2 && Math.random()<0.3 && bldSpan(Math.floor(nextX/112)).x0===0 && bldSpan(Math.floor((nextX+80)/112)).x0===0 && !noRoof(nextX) && !noRoof(nextX+100) && !slushAt(nextX,200) && !blizAt(nextX,200) && !bridgeAt(nextX) && !bridgeAt(nextX+80) && !alleyAt(nextX)){
      // бригада дворников: 5 сосулек, падают только 2–3, у каждой своё время и скорость
      const n = 5, fallN = Math.min(3, 2 + (level>=4 && Math.random()<0.5 ? 1 : 0));
      const idx = [0,1,2,3,4].sort(()=>Math.random()-0.5).slice(0,fallN);
      for(let i=0;i<n;i++){
        const x = nextX + i*16, falls = idx.includes(i);
        const warn = CFG.iceWarn + Math.round(rnd(-10, 30)), grav = rnd(0.17, 0.3);
        const ff = Math.sqrt(2*(GROUND-ICE_H-ROOF-4)/grav);
        const trig = sp0*(warn+ff) + rnd(-10, 40);
        obs.push({t:'ice', x, trig, st: falls?'hang':'dud', k:0, y:ROOF+4, vy:0, warn, grav, brig:true, ph:Math.random()*20});
      }
      nextX += 5*16 + minGap + 70 + rnd(0,extra);
    } else if(level>=3 && Math.random()<0.3 && !bridgeAt(nextX) && !bridgeAt(nextX+40) && !(firstHole && (alleyAt(nextX) || alleyAt(nextX+60) || blizAt(nextX,150) || slushAt(nextX,150)))){
      const hw = Math.round(Math.min(sp*air*0.7, 18 + rnd(0,6) + ((level-1)%CITY_LEN+1)));
      const rep = cityOfL(level-1)===1 && !firstHole && Math.random()<0.6; // Москва: опять меняют плитку на тротуаре
      obs.push({t:'hole', x:nextX, w:hw, rep, tut: firstHole ? 'hole' : null}); firstHole=false;
      if(rep && !SEEN.plitka){ obs[obs.length-1].tutCard='plitka'; }
      nextX += hw + minGap + rnd(0,extra);
    } else {
      let pw = level<=2 ? 14 + rnd(0,10) : Math.min(sp*air*0.75, 16 + rnd(0,14) + ((level-1)%CITY_LEN+1)*2);
      let hint = null;
      let tt = null;
      if(level>=3 && firstBig){ firstBig=false; pw = Math.min(sp*air*0.75, 34); tt='big'; }
      if(cityOf(nextX)===21 && !tt && Math.random()<0.5){ const cw=22; obs.push({t:'curb', x:nextX, w:cw, h:7, lada:LADA_COL[Math.floor(Math.random()*LADA_COL.length)]}); pw=cw; }
      else if((cityOf(nextX)===1||cityOf(nextX)===2) && !tt && Math.random()<0.4){ const cw=Math.round(rnd(12,18)); obs.push({t:'curb', x:nextX, w:cw, h:6}); pw=cw; }
      else obs.push({t:'pud', x:nextX, w:Math.round(pw), hint, tut:tt});
      nextX += pw + minGap + rnd(0,extra);
    }
    // булки дугой над препятствием (подсказка: прыгай) и редкие бонусы в промежутке
    const last = obs[obs.length-1];
    if(last && (last.t==='pud'||last.t==='hole'||last.t==='drift') && Math.random()<0.45){
      const cx = last.x + last.w/2 - 3;
      [[-16,30],[0,38],[16,30]].forEach(([dx,dy])=>obs.push({t:'item', k:'bulka', x:cx+dx-2, y:GROUND-dy}));
    }
    const mid = (startX + nextX)/2 + 20;
    const r = Math.random();
    if(cityOf(mid)===4 && r < 0.04) obs.push({t:'item', k:'bivni', x:mid, y:GROUND-30});
    else if(COLD(cityOf(mid)) && r < 0.45) obs.push({t:'item', k:'chai', x:mid, y:GROUND-14});
    else if(r < 0.07 && lives < MAX_LIVES) obs.push({t:'item', k:'pyshka', x:mid, y:GROUND-32});
    else if(r < 0.11 && level>=2) obs.push({t:'item', k:'shav', x:mid, y:GROUND-32});
    else if(r < 0.15 && level>=2 && pl.shield<1) obs.push({t:'item', k:'kvas', x:mid, y:GROUND-32});
    else if(r < 0.20 && seasonActive()) obs.push({t:'item', k:'toy', x:mid, y:GROUND-18});
    else if(r < 0.27 && MODE!=='week') obs.push({t:'item', k:'token', x:mid, y:GROUND-18});
    else if(r < 0.35) obs.push({t:'item', k:'bulka', x:mid, y:GROUND-14});
  }
  obs = obs.filter(o => o.x > cam - 60);
}

function update(){
  frame++;
  for(const s of snow){ s.y += s.s; s.x += Math.sin((frame+s.d*40)/50)*0.2 - 0.1; if(s.y>H){s.y=-2;s.x=Math.random()*W;} if(s.x<0)s.x+=W; }
  parts = parts.filter(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; return --p.life>0; });
  if(state==='travel'){ travelStep(); return; }

  if(state==='card'){ cardT++; if(jumpPressed && cardT>4) hideCard(); jumpPressed=false; return; }
  if(state==='title'){ jumpPressed=false; return; }
  if(state==='over'){ overT++; if(jumpPressed && overT>30){ jumpPressed=false; retry(); } jumpPressed=false; return; }
  if(bannerT>0) bannerT--;
  if(state==='dead'){
    if(deathCause==='hole'){ pl.y += 2; } else { pl.y += pl.vy; pl.vy += 0.25; }
    if(--deadT<=0 && lives>1){ lives--; respawn(); jumpPressed=false; return; }
    if(deadT<=0 && MODE==='week') weekOver();
    if(deadT<=0){ lives=0; state='over'; overT=0; YA.gameplay(false); overCount++; if(overCount>=2 && overCount%3===2) setTimeout(()=>YA.fullscreen(), 400); YA.saveCloud(); adUsed={cont:false,dbl:false}; const m=Math.floor(pl.x/10); if(m>best){ best=m; try{localStorage.setItem('sosulki_run_best',m);}catch(e){} if(YA.platform==='vk' && MODE!=='zen' && m>=100) setTimeout(()=>YA.leaderboard(m), 1200); } }
    jumpPressed=false; return;
  }

  if(roofMode){ bonusKind==='summer' ? summerStep() : bonusKind==='boss' ? bossStep() : bonusKind==='boss2' ? robotStep() : bonusKind==='boss3' ? bearBossStep() : bonusKind==='boss4' ? frostBossStep() : bonusKind==='sled' ? sledStep() : bonusKind==='boss5' ? crabBossStep() : bonusKind==='mars' ? marsStep() : bonusKind==='gull' ? gullStep() : roofStep(); return; }
  // обучение: игра замирает, пока игрок не нажмёт нужную кнопку
  if(tut){
    bannerT = 60;
    const ok = tut==='stop' ? key.b : jumpPressed;
    if(!ok) return;
    if(tut==='stop'){ pl.vx = baseSpeed()*CFG.brake; }
    endTut();
  }
  // уровень
  const lv = 1 + Math.floor(pl.x / CFG.levelLen);
  if(lv>level){ level=lv; SFX.cp(); saveProgress(); seasonXP(10); nofallStreak++; Q('nofall',0,nofallStreak); Q('level',1);
    if((level-1)%CITY_LEN===0) lives = Math.max(lives, D().lives); // новый город — жизни обновляются
    if(level-1 >= RUN.cities.length*CITY_LEN){ routeDone(); return; }
    if((level-1)%CITY_LEN===0 && level>1) passCity(cityOfL(level-2));
    if((level-1)%CITY_LEN===0){ const ck=['spb','moscow','ekb','surgut','yakutia','kazan','novgorod','tver','nn','novosib','petro','murmansk','irkutsk','khab','vlad','kamch','vostok','tula','gelen','sochi','samara','tlt'][cityOfL(level-1)]; if(!(CARDS[ck] && showCard(ck))) showBanner(CITY_NAMES[cityOfL(level-1)]+'! Уровень '+level); }
    else if(cityOfL(level-1)===21 && cityOfL(level-2)===20 && showCard('tlt')){} else showBanner('Сохранено! Уровень '+level+'. '+levelName(level)+lvlTip(level)); }

  { const Lc = Math.floor(pl.x/CFG.levelLen)+1, b0 = Lc*CFG.levelLen-BR_LEN-20;
    if(pl.x > b0-60 && lastCheer!==Lc && Lc===RUN.cities.length*CITY_LEN){ lastCheer=Lc; for(let n=0;n<30;n++) parts.push({x:b0-60+Math.random()*60,y:GROUND-30-Math.random()*20,vx:(Math.random()-0.5)*2,vy:-1-Math.random()*2,life:50,col:[C.red,C.yel,C.blu,C.pink,C.lgr][n%5]}); [700,900,700,1100].forEach((f,i)=>setTimeout(()=>snd(f,f*0.8,0.05,'square',0.04),i*90)); } }
  const br = bridgeAt(pl.x);
  if(br && lastBridge!==br.L){ lastBridge=br.L;
    if(isStation(br.L) && nextCityAt(br.L)>=0 && MODE!=='zen'){ startTravel(br); return; }
    if(isStation(br.L)){ const nb=nextCityAt(br.L); showBanner(nb<0 ? 'Финиш маршрута «'+(RUN.r>=0?ROUTES[RUN.r].n:CITY_NAMES[RUN.cities[0]])+'»!' : (byTrain(cityOfL(br.L-1),nb)?'Вокзал! Поезд':'Аэропорт! Летим')+(nb===15?' на ':' в ')+CITY_IN[nb]); }
    }
  const al = alleyAt(pl.x);
  if(al && lastAlley!==al.L+1){ lastAlley=al.L+1; if(level<=1 || !showCard('alley')) showBanner('Тёмный переулок — смотри под ноги'); }
  // бег сам + тормоз
  const bz = blizAt(pl.x);
  if(blizAt(pl.x, 120) && lastBliz!==Math.floor(pl.x/CFG.levelLen)){ lastBliz=Math.floor(pl.x/CFG.levelLen); if(!showCard('bliz')) showBanner('Метель!'); }
  const sl = slushAt(pl.x);
  if(slushAt(pl.x, 120) && lastSlush!==Math.floor(pl.x/CFG.levelLen)){ lastSlush=Math.floor(pl.x/CFG.levelLen); if(!showCard('slush')) showBanner('Слякоть!'); }
  if(sl && pl.ground && pl.vx>0.5 && frame%5===0) parts.push({x:pl.x+2,y:GROUND-1,vx:-0.5-Math.random(),vy:-1-Math.random(),life:18,col:C.brn});
  if(COLD(cityOf(pl.x))){
    if(MODE!=='zen') frost = Math.min(100, frost + CFG.frostRate * D().frost * (cityOf(pl.x)===4 ? 1.25 : (cityOf(pl.x)===9||cityOf(pl.x)===12||cityOf(pl.x)===13||cityOf(pl.x)===16) ? 0.7 : 1));
    if(frost>=100){ frost=60; die('frost'); return; }
    if(frost>70 && frame%10===0) parts.push({x:pl.x+Math.random()*10,y:pl.y+Math.random()*8,vx:0,vy:-0.3,life:20,col:C.w});
  } else frost = Math.max(0, frost-1);
  if(pl.inv>0) pl.inv--;
  if(pl.shav>0) pl.shav--;
  const target = baseSpeed() * (key.b ? CFG.brake : 1) * (bz ? BLIZ_SLOW : 1) * (pl.shav>0 ? 1.5 : 1) * (frost>60 && !(bear && bear.st==='ride') ? 0.85 : 1) * (bear && bear.st==='ride' ? 1.9 : 1);
  pl.vx += (target - pl.vx) * (sl ? SLUSH_GRIP : 0.12);
  pl.x += pl.vx;
  Q('steps', pl.vx/5); // 1 метр = 2 шага
  if(frame%120===0) saveDaily();
  // в прыжке человечек летит не медленнее CFG.airMin — на первых уровнях прыжок длиннее и понятнее
  if(!pl.ground && !key.b && pl.vx < CFG.airMin) pl.x += CFG.airMin - pl.vx;
  if(pl.ground) pl.walk += pl.vx*0.15;

  // прыжок: буфер + coyote time + переменная высота
  if(bear && bear.st==='ride') jumpPressed=false;
  if(jumpPressed){ if(sl){ pl.jd = SLUSH_DELAY; } else pl.buf = CFG.buffer; jumpPressed=false; }
  if(pl.jd>0 && --pl.jd===0) pl.buf = CFG.buffer;
  if(pl.buf>0) pl.buf--;
  pl.coyote = pl.ground ? CFG.coyote : Math.max(0, pl.coyote-1);
  if(pl.buf>0 && pl.coyote>0){ pl.vy=CFG.jumpVel; pl.ground=false; pl.coyote=0; pl.buf=0; pl.cut=false; SFX.jump(); }
  if(!key.j && pl.vy<0 && !pl.cut){ pl.vy *= CFG.jumpCut; pl.cut=true; }
  pl.vy = Math.min(CFG.maxFall, pl.vy + CFG.gravity);
  pl.y += pl.vy;
  if(pl.y >= GROUND-pl.h){ pl.y=GROUND-pl.h; pl.vy=0; pl.ground=true; } else pl.ground=false;

  // ===== Медведь: бежит сзади. Догнал — конец. Прыгнул ему на спину — катаешься
  if((COLD(cityOf(pl.x)) || wolfZone(pl.x)) && !bear && MODE!=='zen'){
    if(!nextBearX || nextBearX < pl.x - 2000) nextBearX = pl.x + 300;
    const bearBlock = obs.some(o=>o.t!=='item' && o.x > pl.x-10 && o.x < pl.x+230);
    if(pl.x > nextBearX+250 && bearBlock && !slushAt(pl.x,250) && !blizAt(pl.x,250) && !blizAt(pl.x+250) && !bridgeAt(pl.x+200)) obs = obs.filter(o=>o.t==='item' || o.x < pl.x-10 || o.x > pl.x+230); // долго ждём — освобождаем место для медведя
    if(pl.x > nextBearX && !slushAt(pl.x,250) && !blizAt(pl.x,250) && !blizAt(pl.x+250) && !bridgeAt(pl.x+200) && !obs.some(o=>o.t!=='item' && o.x > pl.x-10 && o.x < pl.x+230)){
      bear = {x: pl.x - 100, st:'chase', t:0};
      snd(90,60,0.6,'sawtooth',0.12);
      const HR = cityOf(pl.x)===4; bear.horse = HR; if(HR) bear.hc = HORSES[Math.floor(Math.random()*HORSES.length)];
      bear.wolf = !HR && wolfZone(pl.x);
      if(!showCard(HR?'horse':bear.wolf?'wolf':'bear')) showBanner(HR ? 'Якутская лошадь сзади! Прыгай!' : bear.wolf ? 'Волк сзади! Прыгай ему на спину!' : 'Медведь сзади! Прыгай ему на спину!');
    }
  }
  if(bear){
    if(bear.st==='chase'){
      bear.x += Math.max(pl.vx, 1) + 1.2;
      if(!SEEN.beartut && pl.ground && pl.x - bear.x < 44){ SEEN.beartut=true; try{localStorage.setItem('sosulki_seen',JSON.stringify(SEEN));}catch(e){} startTut('bearjump'); return; }
      const ov = pl.x+pl.w-2 > bear.x+3 && pl.x+2 < bear.x+21;
      if(ov){
        if(!pl.ground && pl.vy >= 0 && pl.y+pl.h <= GROUND-14+6){ bear.st='ride'; bear.t=CFG.bearRide; Q('ride',1); statUp('ride'); snd(300,800,0.3,'square',0.08); showBanner(bear.horse ? 'Верхом на '+bear.hc.n+' лошади!' : bear.wolf ? 'Верхом на Сером волке!' : 'Верхом на медведе!'); burst(pl.x+5,GROUND-16,C.w,10); }
        else if(pl.ground && pl.inv<=0){ die(bear.horse?'horse':bear.wolf?'wolf':'bear'); bear=null; return; } // в воздухе медведь не ловит — даём шанс приземлиться ему на спину
      }
      if(bear && bear.st==='chase' && bear.x > pl.x + 40) bear.st='leave';
    } else if(bear.st==='ride'){
      bear.x = pl.x - 7; pl.y = GROUND-14-pl.h; pl.vy = 0; pl.ground = true; pl.inv = Math.max(pl.inv, 2);
      if(--bear.t <= 0){ bear.st='leave'; pl.y = GROUND-pl.h; pl.inv = 60; showBanner(bear.horse ? 'Лошадь убежала' : bear.wolf ? 'Волк убежал в лес' : 'Медведь устал'); }
    } else {
      bear.x += 4; if(bear.x > cam + W + 60){ bear=null; nextBearX = pl.x + rnd(450, 800); }
    }
  }
  cam = pl.x - PX;
  generate();

  for(const o of obs){
    if(!o.carded && o.x - cam < W-24 && o.x - cam > 0){
      const k = (o.t==='item' && ['bulka','pyshka','kvas','shav'].includes(o.k)) ? ((LOCAL[cityOf(o.x)]||{})[o.k] ? LOCAL[cityOf(o.x)][o.k][0] : null) : (o.t==='item' && ['toy','token'].includes(o.k)) ? null : (o.t==='item' && (o.k==='chai'||o.k==='bivni')) ? o.k : o.t==='item' ? loc(o.k, cityOf(o.x))[0] : o.t==='granny' ? 'granny' : o.t==='curb' ? 'curb' : o.t==='robot' ? (o.stuck?'stuck':'robot') : (o.t==='ice' && o.brig) ? 'brig' : null;
      if(o.tutCard && !o.carded && o.x-pl.x<120){ o.carded=true; if(showCard(o.tutCard)) return; }
      if(k && o.t!=='item'){ o.carded=true; if(showCard(k)) return; }
    }
    if(o.tut && (o.t==='pud'||o.t==='hole') && !o.tdone && pl.ground && o.x - pl.x < (o.tut==='big'?14:20)){ o.tdone=true; startTut(o.tut==='big'||o.tut==='hole' ? o.tut : 'jump'); return; }
    if(o.hint && !o.hinted && o.x - pl.x < (o.t==='ice' ? o.trig+10 : 120)){ o.hinted=true; showBanner(o.hint); bannerT=180; }
    if(o.t==='item'){

function vband(y,h,top,bot){ // вертикальный градиент полосами
  const n=8; for(let k=0;k<n;k++){ const t=k/(n-1); g.fillStyle=mixc(top,bot,t); g.fillRect(0,Math.round(y+h*k/n),W,Math.ceil(h/n)+1); }
}
function mixc(a,b,t){ const pa=[1,3,5].map(i=>parseInt(a.substr(i,2),16)), pb=[1,3,5].map(i=>parseInt(b.substr(i,2),16)); return 'rgb('+pa.map((v,i)=>Math.round(v+(pb[i]-v)*t)).join(',')+')'; }
function cloud(x,y,sz,col){ R(x,y+sz*0.5,sz*3,sz*0.6,col); R(x+sz*0.4,y+sz*0.2,sz*1.2,sz*0.6,col); R(x+sz*1.3,y,sz*1.1,sz*0.9,col); R(x+sz*2.1,y+sz*0.3,sz*0.8,sz*0.6,col); }
function sun(x,y,r,glow){
  const disc=(rr,col,al)=>{ g.globalAlpha=al; g.fillStyle=col; g.beginPath(); g.arc(x,y,rr,0,Math.PI*2); g.fill(); };
  if(glow){ disc(r*2.6,C.yel,0.12); disc(r*1.7,C.yel,0.22); }
  disc(r,C.yel,1); disc(r*0.55,'#fff6c0',1); g.globalAlpha=1;
}

function frostTree(x,base,h){

    const y = top+r, x0 = x+6-Math.floor(w/2);

    if(w>3) R(x0+w-1,y,1,1,'#a9c4d8');
  }
  for(let n=0;n<4;n++){ const ph=((frame>>3)+n*7+x)%14; if(ph<3){ const gx=x+2+((n*5+x)%9), gy=top+4+n*Math.floor(crownH/5);

  const bo = document.getElementById('ban');
  setUI('ban', banner); bo.style.opacity = (bannerT>0 && state==='play') ? Math.min(1,bannerT/30) : 0;
  setUI('msg', (state==='dead'||state==='over') ? (deathCause==='plow'?'Снегоуборка догнала!':deathCause==='robo'?'Робот-великан победил!':deathCause==='shatun'?'Медведь-шатун победил!':deathCause==='frostboss'?'Хозяин мороза заморозил!':deathCause==='crabboss'?'Шторм победил!':deathCause==='mars'?'Марс оказался суров!':deathCause==='gull'?'Чайка улетела с шапкой!':deathCause==='neva'?'Искупался в Неве!':deathCause==='poop'?'Наступил в собачий сюрприз!':deathCause==='wall'?'Врезался в стену!':deathCause==='roof'?'Сорвался во двор-колодец!':deathCause==='chimney'?'Споткнулся о трубу!':deathCause==='gull'?'Чайка сбила!':deathCause==='line'?'Запутался в белье!':deathCause==='bear'?'Медведь догнал!':deathCause==='horse'?'Якутская лошадь догнала!':deathCause==='wolf'?'Волк догнал!':deathCause==='frost'?'Замёрз! Пей горячий чай':deathCause==='curb'?'Споткнулся о бордюр!':deathCause==='tapok'?'Получил тапком!':deathCause==='robot'?'Сбил робот-доставщик!':deathCause==='drift'?'Утонул в сугробе!':deathCause==='slip'?'Поскользнулся!':deathCause==='trip'?'Споткнулся об лёд!':deathCause==='hole'?'Провалился в люк!':'Бац! Сосулька.') : '');
  const ov = document.getElementById('over');
  if(state==='over'){
    ov.style.display='block'; ov.style.pointerEvents='auto';
    setUI('over', roofMode ? ((bonusKind==='gull'?'Чайка: осталось поймать '+GB.hp+' · ':bonusKind==='mars'?'Марс: ':bonusKind==='boss5'?'Краб: осталось серий '+CB.hp+' · ':bonusKind==='boss4'?'Хозяин мороза: костров '+FB.lit+'/3 · ':bonusKind==='boss3'?'Медведь: осталось ловушек '+MB.hp+' · ':bonusKind==='boss2'?'Робот: осталось таранов '+RB.hp+' · ':bonusKind==='boss'?'Босс: осталось кнопок '+B.hp+' · ':bonusKind==='summer'?'Белые ночи: ':'По крышам: ')+m+' м<br><span style="color:#ffa300">Булок: '+runBulki+' (×2)</span>'+(overT>30?'<br><span style="color:#ff77a8">'+(bonusKind.startsWith('boss')?'Нажми — ещё раз на босса':'Нажми — ещё раз по крышам')+'</span><br><button id="fromStart" style="margin-top:6px;font:700 0.8em system-ui;padding:6px 14px;border:0;border-radius:8px;background:#5f574f;color:#fff1e8">В меню</button>':'')) : 'Пробежал '+m+' м, уровень '+level+'<br><span style="color:#00e436">'+(m>=best?'Новый рекорд!':'Рекорд: '+best+' м')+'</span><br><span style="color:#ffa300">Булок: '+runBulki+' (всего '+totalBulki+')</span>'+(overT>30 ? '<br>'+(YA.platform==='vk'?'<button id="vkTop" style="margin:6px 3px 0;font:800 0.8em system-ui;padding:7px 12px;border:0;border-radius:8px;background:#0077ff;color:#fff">🏆 Друзья</button>':'')+'<button id="shareRun" style="margin:6px 3px 0;font:800 0.8em system-ui;padding:7px 12px;border:0;border-radius:8px;background:#29adff;color:#1d2b53">📤 Поделиться</button>'+(!adUsed.cont?'<button id="adCont" style="margin:6px 3px 0;font:800 0.8em system-ui;padding:7px 12px;border:0;border-radius:8px;background:#00e436;color:#1d2b53">🎬 Продолжить с места</button>':'')+(!adUsed.dbl && runBulki>0?'<button id="adDbl" style="margin:6px 3px 0;font:800 0.8em system-ui;padding:7px 12px;border:0;border-radius:8px;background:#ffa300;color:#1d2b53">🎬 Удвоить булки</button>':'') : '')+'<br><span style="color:#ffa300;font-size:.85em">👟 '+Math.floor(DAILY.steps).toLocaleString('ru-RU')+' / 10 000 шагов · задания '+DAILY.quests.filter(q=>q.done).length+'/'+DAILY.quests.length+'</span>'+(overT>30?'<br><span style="color:#ff77a8">Нажми — ещё раз с уровня '+(D().cityCP ? cityStart(level) : level)+'</span>'+(level>1?'<br><button id="fromStart" style="margin-top:6px;font:700 0.8em system-ui;padding:6px 14px;border:0;border-radius:8px;background:#5f574f;color:#fff1e8">С самого начала</button>':''):''));
  } else ov.style.display='none';
}

// ===== Цикл: фиксированный шаг, одинаково на любом экране =====
let last = performance.now(), acc = 0;
// если что-то сломалось — показываем короткое сообщение на экране, чтобы тестировщик мог прислать скриншот
let errShown=0;
function reportErr(where, e){ try{ console.error(e); if(errShown++>3) return; let d=document.getElementById('errbox');
  if(!d){ d=document.createElement('div'); d.id='errbox'; d.style.cssText='position:fixed;left:4px;bottom:4px;right:4px;z-index:99;font:12px monospace;color:#fff;background:rgba(200,0,40,.85);padding:4px 6px;border-radius:6px;pointer-events:none'; document.body.appendChild(d); }
  d.textContent='Ошибка ('+where+', '+(YA&&YA.platform)+'): '+(e&&e.message)+' '+((e&&e.stack||'').split('\n')[1]||'').trim().slice(0,120); }catch(_){} }
window.addEventListener('error', ev=>reportErr('page', ev.error||{message:ev.message}));
function loop(t){
  if(adPlaying){ last=t; requestAnimationFrame(loop); return; }
  acc += Math.min(100, t-last); last = t;
  requestAnimationFrame(loop);
  try{ while(acc >= 1000/60){ update(); acc -= 1000/60; } }catch(e){ acc=0; reportErr('update', e); }
  try{ draw(); }catch(e){ reportErr('draw', e); }
}
requestAnimationFrame(loop);
window.__gameReady=true;
</script>
